# Repository-local authoring gate. This file intentionally avoids global stages,
# workflow, defaults, and variables so it cannot override the OCBC templates.
rza_migrate_check_gate:
  stage: .pre
  # The Kubernetes runner cannot reliably pull public Docker Hub images.
  # Use the same pinned internal Alpine repository proven by setup-env.
  image: nexus.appsnp.ocbcnisp.com:5004/alpine:3.22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "sit" || $CI_COMMIT_BRANCH == "uat"'
    - if: '$CI_COMMIT_TAG'

  # Do not inherit an unknown default before_script from the central template.
  before_script: []

  script:
    - set -eu
    - test "$(uname -s)" = "Linux"
    - test "$(uname -m)" = "x86_64"
    - test -f tools/license.key
    # Validate the complete release as one unit. This prevents a new checksum
    # being committed beside an old/stale checker binary.
    - sha256sum -c tools/linux-amd64/release.sha256
    - sha256sum -c tools/linux-amd64/rza_migrate_check.sha256
    - chmod +x tools/linux-amd64/rza_migrate_check
    # The embedded source digest must equal the release metadata generated by
    # build_all.bat. A partial/manual rebuild is rejected before repository QA.
    - test "$(tools/linux-amd64/rza_migrate_check -build-info)" = "$(cat tools/linux-amd64/build-info.txt)"
    - sh scripts/verify_release_source.sh .
    - tools/linux-amd64/rza_migrate_check -repo . -check -profile authoring -migration-validation integrity -pause-on-exit false -perf-notes true
    - test -s out/output.json

  artifacts:
    when: always
    paths:
      - out/output.json
    expire_in: 14 days

  allow_failure: false
  interruptible: true
  timeout: 10m

  # Retry runner/image-pull incidents, but never retry a checker/script failure.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
